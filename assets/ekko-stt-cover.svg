<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 456" role="img" aria-labelledby="title description">
  <title id="title">Ekko STT</title>
  <desc id="description">Danish speech-to-text with Ekko Tiny for speech recognition and Ekko PnC for punctuation and capitalization.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#371226"/>
      <stop offset="0.55" stop-color="#231728"/>
      <stop offset="1" stop-color="#171a30"/>
    </linearGradient>
    <radialGradient id="left-glow" cx="0" cy="0.9" r="0.9">
      <stop offset="0" stop-color="#9d204d" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#9d204d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="right-glow" cx="1" cy="0" r="0.75">
      <stop offset="0" stop-color="#57509d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#57509d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff668f"/>
      <stop offset="1" stop-color="#bc9dff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="456" rx="18" fill="url(#background)"/>
  <rect width="1200" height="456" rx="18" fill="url(#left-glow)"/>
  <rect width="1200" height="456" rx="18" fill="url(#right-glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="455" rx="17.5" fill="none" stroke="#b34577" stroke-opacity="0.8"/>

  <text x="64" y="142" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-4">ekko stt</text>
  <text x="66" y="194" fill="#d4c6d2" font-family="Arial, Helvetica, sans-serif" font-size="29">Danish speech-to-text · local inference</text>

  <rect x="64" y="248" width="522" height="145" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.23"/>
  <rect x="614" y="248" width="522" height="145" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.23"/>
  <rect x="87" y="271" width="4" height="17" rx="2" fill="url(#accent)"/>
  <rect x="637" y="271" width="4" height="17" rx="2" fill="url(#accent)"/>

  <text x="103" y="285" fill="#d8bdcf" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">01 / SPEECH RECOGNITION</text>
  <text x="653" y="285" fill="#d8bdcf" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">02 / TEXT FORMATTING</text>
  <text x="87" y="338" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="-1">ekko tiny</text>
  <text x="637" y="338" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="-1">ekko pnc</text>
  <text x="88" y="370" fill="#cbbdc9" font-family="Arial, Helvetica, sans-serif" font-size="20">Words + timestamps</text>
  <text x="638" y="370" fill="#cbbdc9" font-family="Arial, Helvetica, sans-serif" font-size="20">Punctuation + capitalization</text>

  <g fill="none" stroke="#f3aecb" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <path d="M492 329v-12m11 21v-29m11 36v-43m11 30v-17m11 13v-9"/>
  </g>
  <text x="1055" y="342" fill="#f3aecb" font-family="Georgia, serif" font-size="42" font-weight="700" letter-spacing="1">?!</text>
</svg>
